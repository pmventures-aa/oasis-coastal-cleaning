# Oasis Coastal Cleaning — Cloudflare Pages.
#
# LAYOUT (getting this wrong fails the deploy)
#   public/      every file that is served. This is the build output dir.
#   functions/   the API. Must sit OUTSIDE the output dir, at the repo root,
#                or Cloudflare will not compile it.
#
# There is no build step. If you create the project by hand:
#   Framework preset    None
#   Build command       (leave empty)
#   Build output dir    public
#   Root directory      (leave empty)
#
# Deploy from a terminal instead:
#   npx wrangler pages deploy public --project-name oasis-coastal-cleaning

name = "oasis-coastal-cleaning"
compatibility_date = "2026-08-01"
pages_build_output_dir = "public"

[vars]
QUOTE_TO_EMAIL = "info@oasiscoastalcleaning.com"
# A sender verified in Resend. Leave commented until the domain is verified —
# until then Resend's shared onboarding sender is used.
# QUOTE_FROM_EMAIL = "Oasis Coastal Cleaning <quotes@oasiscoastalcleaning.com>"

# ---------------------------------------------------------------- database
# The leads portal needs this. The site deploys and works without it — quote
# requests are still emailed — but nothing is saved and the portal will show
# setup instructions instead of a list.
#
# IMPORTANT: because this file exists, Cloudflare reads bindings from HERE and
# ignores ones added in the dashboard. So the binding has to be added below,
# not in Settings.
#
#   1. npx wrangler d1 create oasis
#   2. paste the database_id it prints into the block below
#   3. uncomment the block
#   4. npx wrangler d1 migrations apply oasis --remote
#   5. commit and push — the next deploy picks it up
#
[[d1_databases]]
binding = "DB"
database_name = "oasis"
database_id = "local-test-only"
migrations_dir = "migrations"

# ----------------------------------------------------------------- secrets
# NOT set here — these are secrets. Add them under
# Settings → Variables and secrets, or with `wrangler pages secret put`:
#
#   ADMIN_PASSWORD         the password for the leads portal at /admin
#   SESSION_SECRET         any long random string; signs the login cookie
#   RESEND_API_KEY         so new requests reach the inbox
#   TURNSTILE_SECRET_KEY   optional spam check; pairs with turnstileSiteKey
#                          in public/js/data.js
#
# Environment changes only apply to a NEW deployment. After adding them, go to
# Deployments and retry the latest one.
