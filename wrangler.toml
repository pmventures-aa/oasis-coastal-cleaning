# Oasis Coastal Cleaning — Cloudflare Worker with static assets.
#
# This is a WORKER, not a Pages project. Cloudflare accounts created recently
# no longer offer Pages, and a Pages-shaped repo fails there with
# "Missing entry-point to Worker script or to assets directory".
#
# LAYOUT
#   public/     the site. Served straight from the assets runtime.
#   src/        the Worker: index.js routes /api/*, everything else is a file.
#
# Dashboard settings, if you are creating the project by hand:
#   Build command     (leave empty — there is nothing to build)
#   Deploy command    npx wrangler deploy
#
# Both are the defaults, so connecting the repo and saving is usually enough.

name = "oasis-coastal-cleaning"
main = "src/index.js"
compatibility_date = "2026-08-01"

[assets]
directory = "./public"
binding = "ASSETS"
# Serves /services from services.html, the way Pages did.
html_handling = "auto-trailing-slash"
# Unknown paths get the site's own 404 page rather than a bare Cloudflare one.
not_found_handling = "404-page"

[vars]
QUOTE_TO_EMAIL = "info@oasiscoastalcleaning.com"
# A sender verified in Resend. Leave commented until the domain is verified —
# until then Resend's shared onboarding sender is used.
# QUOTE_FROM_EMAIL = "Oasis Coastal Cleaning <quotes@oasiscoastalcleaning.com>"

# ---------------------------------------------------------------- database
# The leads portal needs this. The site deploys and works without it — quote
# requests are still emailed — but nothing is saved and the portal shows setup
# instructions instead of a list.
#
#   1. Cloudflare → Storage & Databases → D1 → Create, named "oasis"
#   2. paste its Database ID below and uncomment these four lines
#   3. create the table (the SQL is in migrations/0001_leads.sql)
#   4. commit — the next deploy picks it up
#
# [[d1_databases]]
# binding = "DB"
# database_name = "oasis"
# database_id = "PASTE-THE-ID-HERE"

# ----------------------------------------------------------------- secrets
# NOT set here. Add under Settings → Variables and secrets:
#   ADMIN_PASSWORD         the password for the leads portal at /admin
#   SESSION_SECRET         any long random string; signs the login cookie
#   RESEND_API_KEY         so new requests reach the inbox
#   TURNSTILE_SECRET_KEY   optional spam check; pairs with turnstileSiteKey
#                          in public/js/data.js
#
# Environment changes only apply to a NEW deployment.
