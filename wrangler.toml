# Oasis Coastal Cleaning — Cloudflare Pages.
#
# Layout matters here, and getting it wrong fails the deploy:
#
#   public/      every file that is served. This is the build output dir.
#   functions/   the Pages Function behind /api/quote. It must sit OUTSIDE
#                the output dir, at the repository root, or Cloudflare will
#                not compile it.
#
# There is no build step. Dashboard settings, if you are creating the project
# by hand:
#   Framework preset    None
#   Build command       (leave empty)
#   Build output dir    public
#   Root directory      (leave empty)
#
# Deploy from a terminal instead:
#   npx wrangler pages deploy public --project-name oasis-coastal-cleaning

name = "oasis-coastal-cleaning"
compatibility_date = "2026-08-01"
pages_build_output_dir = "public"

[vars]
QUOTE_TO_EMAIL = "info@oasiscoastalcleaning.com"
